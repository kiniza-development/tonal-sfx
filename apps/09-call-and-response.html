<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Call & Response · Tonal SFX Suite</title>
<meta name="description" content="Generative tonal sound effects in any key — Call & Response. Web Audio, renders WAV loops for video editing.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0b; --panel:#121214; --panel2:#18181b; --line:#26262b; --line2:#34343a;
  --ink:#ece8e1; --ink2:#a9a49b; --ink3:#6d6a64;
  --accent:#e8a33d; --accent-ink:#141008;
  --serif:"Instrument Serif", "Iowan Old Style", Georgia, serif;
  --mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --sans:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:4px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45}
body{min-height:100vh;background:
  radial-gradient(1200px 600px at 85% -10%, color-mix(in srgb,var(--accent) 9%, transparent), transparent 60%),
  radial-gradient(900px 500px at -10% 110%, rgba(255,255,255,.025), transparent 60%), var(--bg)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.06;z-index:0;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.wrap{position:relative;z-index:1;max-width:1280px;margin:0 auto;padding:28px 28px 60px}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.skip{position:absolute;left:-999px}.skip:focus{left:12px;top:12px;background:var(--accent);color:var(--accent-ink);padding:6px 10px;z-index:9}

/* header */
header.top{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end;border-bottom:1px solid var(--line);padding-bottom:20px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.eyebrow b{color:var(--accent);font-weight:500}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(40px,5.4vw,68px);line-height:.95;margin:10px 0 8px;letter-spacing:-.01em}
h1 em{color:var(--accent);font-style:italic}
.tagline{color:var(--ink2);max-width:60ch;margin:0}
nav.suite{display:grid;grid-template-columns:1fr 1fr;gap:3px 8px;min-width:420px;max-width:540px}
nav.suite a{display:grid;grid-template-columns:18px 1fr auto;gap:6px;align-items:center;text-decoration:none;color:var(--ink2);
  font-family:var(--mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;padding:4px 6px;border:1px solid transparent;border-radius:var(--r)}
nav.suite a:hover{border-color:var(--line2);color:var(--ink)}
nav.suite a[aria-current]{border-color:var(--accent);color:var(--ink)}
nav.suite a span.bar{width:16px;height:4px;border-radius:1px;background:var(--line2)}
nav.suite a[aria-current] span.bar{background:var(--accent)}
nav.suite a small{color:var(--ink3)}

/* layout */
main.grid{display:grid;grid-template-columns:330px 1fr;gap:22px;margin-top:22px}
@media (max-width:920px){main.grid{grid-template-columns:1fr} header.top{grid-template-columns:1fr}}
.panel{background:linear-gradient(180deg,var(--panel),#0f0f11);border:1px solid var(--line);border-radius:6px}
.controls{padding:6px 18px 18px;align-self:start}
fieldset{border:0;border-top:1px solid var(--line);margin:0;padding:14px 0 6px}
fieldset:first-child{border-top:0}
legend{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);padding:0;margin-bottom:10px;float:left;width:100%}
legend + *{clear:left}
.ctl{display:grid;grid-template-columns:96px 1fr;align-items:center;gap:10px;margin:0 0 10px}
.ctl > label,.ctl > .lbl{font-size:12.5px;color:var(--ink2)}
.ctl output{font-family:var(--mono);font-size:11px;color:var(--ink);min-width:44px;text-align:right}
.rangewrap{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
select,input[type=text],input[type=number]{width:100%;background:var(--panel2);color:var(--ink);border:1px solid var(--line2);border-radius:var(--r);
  padding:7px 9px;font-family:var(--mono);font-size:12px;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);
  background-position:calc(100% - 14px) 50%,calc(100% - 9px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:24px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--line2)}
input[type=range]::-moz-range-track{height:2px;background:var(--line2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;margin-top:-5px;border-radius:50%;background:var(--ink);border:2px solid var(--bg);box-shadow:0 0 0 1px var(--accent)}
input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;background:var(--ink);border:2px solid var(--bg);box-shadow:0 0 0 1px var(--accent)}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{flex:1 1 auto}
button{font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;background:var(--panel2);color:var(--ink2);border:1px solid var(--line2);
  border-radius:var(--r);padding:7px 10px;cursor:pointer;transition:border-color .12s,color .12s,background .12s}
button:hover{color:var(--ink);border-color:var(--ink3)}
button[aria-pressed=true]{background:color-mix(in srgb,var(--accent) 16%, var(--panel2));color:var(--ink);border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
button:disabled{opacity:.45;cursor:wait}
.seedrow{display:grid;grid-template-columns:1fr auto auto;gap:6px}
.keygrid{display:grid;grid-template-columns:repeat(6,1fr);gap:3px}
.keygrid button{padding:6px 0}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.chip{font-family:var(--mono);font-size:10.5px;padding:2px 6px;border:1px solid var(--line2);border-radius:2px;color:var(--ink2)}
.chip.tonic{border-color:var(--accent);color:var(--accent)}
.hint{font-size:11.5px;color:var(--ink3);margin:2px 0 8px}

/* stage */
.stage{display:flex;flex-direction:column;gap:14px;min-width:0}
.screen{position:relative;padding:14px 16px 12px}
.screen .head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:8px}
.readout{font-family:var(--mono);font-size:11px;color:var(--ink2);letter-spacing:.05em}
.readout b{color:var(--ink);font-weight:500}
.bigkey{font-family:var(--serif);font-size:30px;line-height:1}
.bigkey small{font-family:var(--mono);font-size:11px;color:var(--ink3);margin-left:8px;letter-spacing:.08em}
canvas{display:block;width:100%;background:#09090a;border:1px solid var(--line);border-radius:3px}
canvas.wave{height:120px}
canvas.roll{height:190px}
canvas.scope{height:64px}
.row2{display:grid;grid-template-columns:2fr 1fr;gap:14px}
@media (max-width:700px){.row2{grid-template-columns:1fr}}
.transport{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 14px}
.transport .play{min-width:110px;font-size:13px;padding:10px 14px}
.transport .sp{flex:1}
.transport .status{font-family:var(--mono);font-size:11px;color:var(--ink3)}
.kbd{font-family:var(--mono);font-size:10px;color:var(--ink3);border:1px solid var(--line2);border-bottom-width:2px;border-radius:3px;padding:0 4px;margin-left:4px}
.note{padding:16px 18px;color:var(--ink2);font-size:13px}
.note h2{font-family:var(--serif);font-weight:400;font-size:24px;color:var(--ink);margin:0 0 6px}
.note p{margin:0 0 8px;max-width:78ch}
.stack{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0 6px}
.stack div{border:1px solid var(--line2);border-radius:3px;padding:8px 10px;font-size:12px}
.stack div b{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);font-weight:500;margin-bottom:2px}
.stack div.on{border-color:var(--accent)}
.stack div.on b{color:var(--accent)}
@media (max-width:700px){.stack{grid-template-columns:1fr 1fr}}
footer{margin-top:28px;color:var(--ink3);font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.ctl.col{grid-template-columns:1fr;gap:6px}
.ctl.col .seg button{flex:1 1 30%}
.legend-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;font-family:var(--mono);font-size:10.5px;color:var(--ink3)}
.legend-row i{display:inline-block;width:10px;height:6px;border-radius:1px;margin-right:5px;vertical-align:middle}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin-top:10px;font-family:var(--mono);font-size:11px}
.stats dt{color:var(--ink3)} .stats dd{margin:0;color:var(--ink);text-align:right}
.progline{font-family:var(--serif);font-size:20px;color:var(--ink);margin-top:10px;letter-spacing:.02em}
.progline span{color:var(--ink3);font-size:14px;margin:0 6px}
button.primary .kbd{color:inherit;border-color:currentColor;opacity:.6}
body{background-attachment:fixed}

nav.suite a.home{grid-column:1/-1;border-bottom:1px dashed var(--line2);margin-bottom:4px}
nav.suite a.home span.bar{background:transparent;border:1px solid var(--line2)}


</style></head>
<body><noscript>This app needs JavaScript and the Web Audio API.</noscript>
<script>
'use strict';
/* ===== Tonal SFX Suite · shared engine (inlined into every app) ===== */
/* ---------- seeded PRNG ---------- */
function xmur3(str){let h=1779033703^str.length;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19;}
  return function(){h=Math.imul(h^(h>>>16),2246822507);h=Math.imul(h^(h>>>13),3266489909);return (h^=h>>>16)>>>0;};}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function makeRng(seed){
  const r=mulberry32(xmur3(String(seed))());
  return {next:r,range:(a,b)=>a+r()*(b-a),int:(a,b)=>a+Math.floor(r()*(b-a+1)),
    pick:a=>a[Math.floor(r()*a.length)],chance:p=>r()<p,
    weighted(pairs){let s=0;for(const p of pairs)s+=p[1];let x=r()*s;for(const p of pairs){if((x-=p[1])<=0)return p[0];}return pairs[pairs.length-1][0];},
    fork:tag=>makeRng(seed+'/'+tag)};
}
function todaySeed(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
const SEED_A=['amber','basalt','cinder','dusk','ember','fjord','gilt','harbor','indigo','juniper','kiln','lumen','marrow','nocturne','ochre','pewter','quarry','rust','sable','tide','umber','vesper','willow','zinc'];
const SEED_B=['arc','bell','choir','drift','echo','field','glow','hush','iris','lake','moth','north','orbit','pulse','reel','swell','tape','veil','wake','yard'];
function randomSeedWord(){const p=a=>a[Math.floor(Math.random()*a.length)];return p(SEED_A)+'-'+p(SEED_B)+'-'+String(Math.floor(Math.random()*100)).padStart(2,'0');}

/* ---------- music theory ---------- */
const NOTE_NAMES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const SCALES={major:[0,2,4,5,7,9,11],minor:[0,2,3,5,7,8,10]};
const ROMAN={major:['I','ii','iii','IV','V','vi','vii°'],minor:['i','ii°','III','iv','v','VI','VII']};
const PROGS={major:[[0,4,5,3],[0,5,3,4],[5,3,0,4],[0,3,5,4],[0,2,3,4],[3,4,0,5],[0,3,0,4],[0,5,1,4]],
             minor:[[0,5,2,6],[0,3,4,0],[0,6,5,6],[0,2,6,3],[5,6,0,0],[0,3,5,4],[0,5,3,4],[0,6,3,5]]};
const mtof=m=>440*Math.pow(2,(m-69)/12);
const keyName=k=>NOTE_NAMES[k.root]+' '+k.mode;
const keyTag=k=>NOTE_NAMES[k.root].replace('#','sharp')+(k.mode==='major'?'maj':'min');
const relativeKey=k=>k.mode==='major'?{root:(k.root+9)%12,mode:'minor'}:{root:(k.root+3)%12,mode:'major'};
const scaleNotes=k=>SCALES[k.mode].map(i=>NOTE_NAMES[(k.root+i)%12]);
function degMidi(k,deg,oct){const o=Math.floor(deg/7),d=deg-o*7;return 12*(oct+1)+k.root+SCALES[k.mode][d]+12*o;}
const midiName=m=>NOTE_NAMES[((m%12)+12)%12]+(Math.floor(m/12)-1);
function chordMidis(k,deg,oct,size=3){const o=[];for(let i=0;i<size;i++)o.push(degMidi(k,deg+2*i,oct));return o;}
function fold(notes,lo,hi){return notes.map(m=>{while(m<lo)m+=12;while(m>hi)m-=12;return m;}).sort((a,b)=>a-b);}
function inKey(k,m){return SCALES[k.mode].includes(((m-k.root)%12+12)%12);}
function euclid(p,n){const o=[];for(let i=0;i<n;i++)o.push(((i*p)%n)<p?1:0);return o;}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ---------- envelopes & voices ---------- */
function perc(p,t,a,dec,peak){p.setValueAtTime(0,t);p.linearRampToValueAtTime(peak,t+a);p.setTargetAtTime(0,t+a,dec/6);return t+a+dec;}
function adsr(p,t,{a=0.01,d=0.1,s=0.7,r=0.3,peak=1,hold}){
  const h=Math.max(hold,t+a+0.002);p.setValueAtTime(0,t);p.linearRampToValueAtTime(peak,t+a);
  if(t+a+d<h){p.linearRampToValueAtTime(peak*s,t+a+d);p.setValueAtTime(peak*s,h);}else{p.linearRampToValueAtTime(peak+(peak*s-peak)*((h-t-a)/d),h);}
  p.linearRampToValueAtTime(0,h+r);return h+r;}
function osc(ctx,type,f,t,end,det=0){const o=ctx.createOscillator();o.type=type;o.frequency.value=f;if(det)o.detune.value=det;o.start(t);o.stop(end+0.03);return o;}
function pan(ctx,v){const n=ctx.createStereoPanner?ctx.createStereoPanner():ctx.createGain();if(n.pan)n.pan.value=clamp(v,-1,1);return n;}
const _noise={};
function noiseBuf(ctx,sec){const key=ctx.sampleRate+'_'+sec;if(_noise[key])return _noise[key];const n=Math.floor(sec*ctx.sampleRate),b=ctx.createBuffer(2,n,ctx.sampleRate),r=makeRng('noise'+sec);
  for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<n;i++)d[i]=r.next()*2-1;}return(_noise[key]=b);}
function noiseSrc(ctx,t,end){const s=ctx.createBufferSource();s.buffer=noiseBuf(ctx,4);s.loop=true;s.start(t);s.stop(end+0.03);return s;}

const V={
  pluck(ctx,d,t,dur,m,vel=1,o={}){const f=mtof(m),dec=o.decay||Math.max(0.3,dur*2.2),lp=ctx.createBiquadFilter();lp.type='lowpass';lp.Q.value=o.q??3;
    lp.frequency.setValueAtTime(Math.min(16000,f*(o.bright??9)),t);lp.frequency.setTargetAtTime(f*1.4,t+0.002,dec/5);
    const g=ctx.createGain(),end=perc(g.gain,t,0.002,dec,0.2*vel);
    for(const c of[-7,7])osc(ctx,o.wave||'sawtooth',f,t,end,c).connect(lp);osc(ctx,'triangle',f/2,t,end).connect(lp);lp.connect(g);g.connect(d);return end;},
  stab(ctx,d,t,dur,m,vel=1,o={}){const f=mtof(m),lp=ctx.createBiquadFilter();lp.type='lowpass';lp.Q.value=1.2;
    lp.frequency.setValueAtTime(Math.min(15000,f*(o.bright??6)),t);lp.frequency.setTargetAtTime(f*(o.floor??2),t+0.01,o.fdec??0.12);
    const g=ctx.createGain(),end=adsr(g.gain,t,{a:o.a??0.004,d:o.d??0.12,s:o.s??0.5,r:o.r??0.1,peak:0.1*vel,hold:t+dur});
    for(const c of[-9,0,9])osc(ctx,'sawtooth',f,t,end,c).connect(lp);lp.connect(g);g.connect(d);return end;},
  bell(ctx,d,t,dur,m,vel=1,o={}){const f=mtof(m),ratio=o.ratio||3.5,dec=o.decay||2.4,idx=o.index??2.2;
    const car=osc(ctx,'sine',f,t,t+dec+0.01),mod=osc(ctx,'sine',f*ratio,t,t+dec+0.01),mg=ctx.createGain();
    mg.gain.setValueAtTime(f*idx,t);mg.gain.exponentialRampToValueAtTime(f*0.02+0.01,t+dec*0.5);mod.connect(mg);mg.connect(car.frequency);
    const g=ctx.createGain(),end=perc(g.gain,t,0.003,dec,0.22*vel);car.connect(g);g.connect(d);return end;},
  glass(ctx,d,t,dur,m,vel=1,o={}){const f=mtof(m),dec=o.decay||3.2,g=ctx.createGain(),end=perc(g.gain,t,0.012,dec,0.2*vel);
    [[1,1],[2,0.28],[3,0.09]].forEach(([h,a])=>{const gg=ctx.createGain();gg.gain.value=a;osc(ctx,'sine',f*h,t,end).connect(gg);gg.connect(g);});g.connect(d);return end;},
  kalimba(ctx,d,t,dur,m,vel=1){const f=mtof(m),g=ctx.createGain(),end=perc(g.gain,t,0.002,1.2,0.26*vel);osc(ctx,'sine',f,t,end).connect(g);
    const g2=ctx.createGain();perc(g2.gain,t,0.001,0.09,0.12*vel);osc(ctx,'sine',f*3,t,t+0.12).connect(g2);g2.connect(d);g.connect(d);return end;},
  mallet(ctx,d,t,dur,m,vel=1){const f=mtof(m),g=ctx.createGain(),end=perc(g.gain,t,0.002,0.7,0.22*vel);osc(ctx,'triangle',f,t,end).connect(g);
    const g2=ctx.createGain();perc(g2.gain,t,0.001,0.08,0.1*vel);osc(ctx,'sine',f*4,t,t+0.1).connect(g2);g2.connect(d);g.connect(d);return end;},
  lead(ctx,d,t,dur,m,vel=1){const f=mtof(m),lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=Math.min(9000,f*3.2);lp.Q.value=0.8;
    const g=ctx.createGain(),end=adsr(g.gain,t,{a:0.05,d:0.25,s:0.75,r:0.28,peak:0.16*vel,hold:t+dur});
    const vib=osc(ctx,'sine',5.2,t,end),vg=ctx.createGain();vg.gain.setValueAtTime(0,t);vg.gain.linearRampToValueAtTime(11,t+Math.min(0.5,dur));vib.connect(vg);
    const a=osc(ctx,'sawtooth',f,t,end,-4),b=osc(ctx,'triangle',f,t,end,4);vg.connect(a.detune);vg.connect(b.detune);
    const ag=ctx.createGain();ag.gain.value=0.45;a.connect(ag);ag.connect(lp);b.connect(lp);lp.connect(g);g.connect(d);return end;},
  bass(ctx,d,t,dur,m,vel=1){const f=mtof(m),lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=520;
    const g=ctx.createGain(),end=adsr(g.gain,t,{a:0.006,d:0.25,s:0.6,r:0.08,peak:0.38*vel,hold:t+dur});
    osc(ctx,'sine',f,t,end).connect(g);const tg=ctx.createGain();tg.gain.value=0.35;osc(ctx,'triangle',f,t,end).connect(lp);lp.connect(tg);tg.connect(g);g.connect(d);return end;},
  musicbox(ctx,d,t,dur,m,vel=1){return V.bell(ctx,d,t,dur,m+12,vel*0.9,{ratio:4,decay:1.7,index:1.1});},
};

/* ---------- FX ---------- */
const _ir={};
function makeIR(ctx,sec,bright=0.5){const key=ctx.sampleRate+'_'+sec+'_'+bright;if(_ir[key])return _ir[key];
  const sr=ctx.sampleRate,n=Math.floor(sec*sr),b=ctx.createBuffer(2,n,sr),r=makeRng('ir'+sec+bright),k=0.12+bright*0.6;
  for(let c=0;c<2;c++){const d=b.getChannelData(c);let lp=0;for(let i=0;i<n;i++){lp+=(r.next()*2-1-lp)*k;const x=i/n;d[i]=lp*Math.pow(1-x,2)*Math.exp(-x*2.2)*(i<sr*0.012?i/(sr*0.012):1);}}
  return(_ir[key]=b);}
function fxBus(ctx,out,{reverb=0.25,size=3.5,bright=0.5,delay=0,delayTime=0.375,feedback=0.35}={}){
  const inp=ctx.createGain();inp.connect(out);

const DRONE_MOODS={

  Dark:{wave:'triangle',voices:2,det:6,range:[41,62],cut:0.45,oct:2},
  Glass:{wave:'sine',voices:2,det:5,range:[60,84],cut:1.8,oct:4},
  Choir:{wave:'sawtooth',voices:3,det:12,range:[50,72],cut:1.2,oct:3,formant:true},
  Tape:{wave:'sawtooth',voices:2,det:7,range:[48,72],cut:0.8,oct:3,wow:true},

const VOWELS=[[730,1090,2440],[300,870,2240],[530,1840,2480],[570,840,2410]];
/* Foundation: drones & pads. P: key,mood,evolve,bright,motion,texture,sub,reverb ; T: loopSec,total,barSec?,mask? */

/* Mid: rhythmic / chord loops. P: key,style,density,swing,chordRate,bass,pump,reverb,delay ; T: barSec,bars,loopSec,total,mask? */

const WAVES={Clean:'triangle',Cinematic:'sawtooth',Synth:'sawtooth',Metallic:'square'};

function glueImpact(ctx,dest,P,rng,t,ev,D=3){

  const sg=ctx.createGain();const e1=perc(sg.gain,t,0.002,Math.min(D,1+I*2.5),0.9*(0.5+I*0.5));so.connect(sg);sg.connect(dest);so.start(t);so.stop(e1+0.05);ev.push({t,dur:e1-t,midi:sm,layer:0});

/* Shared by later apps (07, 10, 13, 15) */
function genGlassGrains(ctx,out,P,rng,T){
  const L=T.loopSec,k=P.key,ev=[],D=P.density??0.48,dec=0.35+P.decay*2.8,sc=P.scatter??0.4;
  const bus=fxBus(ctx,out,{reverb:P.reverb??0.5,size:4.2,bright:0.72,delay:0.12,delayTime:L/Math.max(4,Math.round(L/0.375)),feedback:0.22});
  const n=Math.round(L*(3+D*16)),step=L/n;
  const centre=rng.int(0,4);const pool=[centre,centre+2,centre+4,centre+1,centre+7].map(d=>((d%7)+7)%7);
  const names=pool.map(d=>NOTE_NAMES[(k.root+SCALES[k.mode][d])%12]);
  const voice=P.grain,decMul=voice==='Crystal'?1.35:1;
  for(let i=0;i<n;i++){
    let t=i*step;if(sc>0.05)t=(t+rng.range(-step*sc*0.7,step*sc*0.7)+L)%L;
    if(sc<0.25)t=Math.round(t/(L/64))*(L/64)%L;
    const walk=Math.round((i/n)*P.evolve*6)*rng.pick([-1,1]);
    const deg=pool[i%pool.length]+walk;
    const oct=4+(rng.chance(0.25+D*0.2)?1:0)+(rng.chance(0.12)?1:0);
    const m=degMidi(k,deg,oct),vel=(0.45+rng.range(0,0.5))*(0.55+D*0.5);
    const kind=voice==='Mixed'?(rng.chance(0.55)?'Glass':'Pluck'):voice;
    if(kind==='Glass')V.glass(ctx,bus,t,0.2,m,vel,{decay:dec*decMul});
    else if(kind==='Crystal')V.bell(ctx,bus,t,0.3,m,vel*0.85,{ratio:rng.pick([2,2.5,3.5]),decay:dec*1.2,index:1.6});
    else V.pluck(ctx,bus,t,0.12,m,vel,{bright:7+D*5,decay:dec*0.55,wave:'triangle'});
    ev.push({t,dur:Math.min(1.2,dec*0.5),midi:m,layer:m<60?0:m<76?1:2});
  }
  return {events:ev,n,pool:names};
}

function genTension(ctx,out,P,rng,T){
  const L=T.loopSec,k=P.key,ev=[],I=P.intensity??0.55,fade=Math.min(2.8,L/5);
  const kinds={sus2:[0,1,4],sus4:[0,3,4],'7th':[0,2,4,6],'9th':[0,2,4,8]};
  const seq=P.interval==='Mixed'?['sus4','sus2','7th','sus4']:null;
  const nSeg=P.resolve==='Hold'?Math.max(1,P.interval==='Mixed'?4:2):4;
  const seg=L/nSeg,bus=fxBus(ctx,out,{reverb:P.reverb??0.48,size:5.5,bright:0.35+P.bright*0.4});
  const snap=f=>Math.max(1/L,Math.round(f*L)/L);
  const mf=ctx.createBiquadFilter();mf.type='lowpass';mf.Q.value=0.8+P.motion*2;mf.frequency.value=280+P.bright*3400;mf.connect(bus);
  const cyc=Math.max(1,Math.round(L/(16-10*P.motion))),lfo=osc(ctx,'sine',cyc/L,0,T.total||L+fade),lg=ctx.createGain();lg.gain.value=(280+P.bright*3400)*0.55*P.motion;lfo.connect(lg);lg.connect(mf.frequency);
  const voice=(t0,t1,midi,gain,layer)=>{
    const g=ctx.createGain(),fd=Math.min(fade, (t1-t0)*0.4);
    g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(gain,t0+fd);g.gain.setValueAtTime(gain,t1);g.gain.linearRampToValueAtTime(0,t1+fd);
    osc(ctx,'sine',snap(mtof(midi)),t0,t1+fd).connect(g);osc(ctx,'triangle',snap(mtof(midi)),t0,t1+fd,5).connect(g);g.connect(mf);
    ev.push({t:t0,dur:t1-t0,midi,layer});
  };
  const root=degMidi(k,0,2);voice(0,L,root,0.16+I*0.08,0);voice(0,L,root-12,0.22+I*0.1,0);
  const labels=[];
  for(let s=0;s<nSeg;s++){
    const t0=s*seg,t1=t0+seg;let resolved=false;
    if(P.resolve==='Cadence'&&s>=nSeg-1)resolved=true;
    if(P.resolve==='Half'&&s===Math.floor(nSeg/2))resolved=true;
    const name=resolved?'triad':(seq?seq[s%seq.length]:P.interval);
    const degs=resolved?[0,2,4]:(kinds[name]||kinds.sus4);
    labels.push(name);
    degs.forEach((d,i)=>{const oct=d>=7?4:3,m=degMidi(k,d,oct);voice(t0,t1,m,(0.055+I*0.05)*(i?0.85:1),resolved?2:1);});
  }
  return {events:ev,segs:nSeg,label:labels.join(' → ')};
}

function genSwells(ctx,out,P,rng,T){
  const k=P.key,bar=T.barSec,bars=T.bars,L=T.loopSec,ev=[],prog=rng.pick(PROGS[k.mode]);
  const win=P.crest==='Half bar'?bar/2:P.crest==='Two bars'?bar*2:bar;
  const n=Math.max(1,Math.round(L/win)),W=L/n;
  const bus=fxBus(ctx,out,{reverb:P.reverb??0.4,size:4.5,bright:0.45+P.bright*0.3});
  const wave=P.character==='Silk'?'sine':P.character==='Brass'?'sawtooth':P.character==='Choir'?'sawtooth':'triangle';
  const openF=900+P.bright*7000+P.brass*2500,closedF=180+P.bright*220;

    const t0=s*W,peak=t0+W*0.92,t1=t0+W,deg=prog[Math.floor((t0+1e-6)/bar)%prog.length];
    const notes=fold(chordMidis(k,deg,3,P.character==='Silk'?3:4),48,76);
    const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.Q.value=0.7+P.brass*3;lp.frequency.setValueAtTime(closedF,t0);lp.frequency.linearRampToValueAtTime(openF,peak);lp.frequency.linearRampToValueAtTime(closedF,t1+0.2);lp.connect(bus);
    notes.forEach((m,i)=>{

      g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(pk,peak);g.gain.linearRampToValueAtTime(0.0001,t1+0.15);
      for(const c of(P.character==='Silk'?[0]:[-7,7]))osc(ctx,wave,mtof(m),t0,t1+0.2,c).connect(g);
      g.connect(lp);ev.push({t:t0,dur:W,midi:m,layer:i===0?0:i===notes.length-1?2:1});
    });
    if(P.character==='Choir'){const v=rng.pick(VOWELS),sum=ctx.createGain();sum.gain.value=0.9;v.forEach((fq,i)=>{const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=fq;bp.Q.value=5+i*2;lp.connect(bp);bp.connect(sum);});sum.connect(bus);}

}
/* ---------- playback ---------- */
class Player{
  constructor(){this.ctx=null;this.srcs=[];this.gains=[];this.playing=false;}
  ensure(){if(!this.ctx){const AC=window.AudioContext||window.webkitAudioContext;this.ctx=new AC();this.out=this.ctx.createGain();
    this.an=this.ctx.createAnalyser();this.an.fftSize=2048;this.out.connect(this.an);this.an.connect(this.ctx.destination);}
    if(this.ctx.state==='suspended')this.ctx.resume();return this.ctx;}
  play(bufs,loop,offset=0,gains){this.stop(true);const c=this.ensure(),t0=c.currentTime+0.05;this.dur=bufs[0].duration;this.loop=loop;
    offset=loop?offset%this.dur:0;this.t0=t0-offset;this.vg=c.createGain();this.vg.gain.setValueAtTime(0,t0);this.vg.gain.linearRampToValueAtTime(1,t0+0.01);this.vg.connect(this.out);
    this.gains=bufs.map((b,i)=>{const g=c.createGain();g.gain.value=gains?gains[i]:1;g.connect(this.vg);return g;});
    this.srcs=bufs.map((b,i)=>{const s=c.createBufferSource();s.buffer=b;s.loop=loop;s.connect(this.gains[i]);s.start(t0,offset);return s;});
    this.playing=true;const first=this.srcs[0];if(!loop)first.onended=()=>{if(this.srcs[0]===first){this.playing=false;this.onend&&this.onend();}};}
  setGain(i,v){if(this.gains[i])this.gains[i].gain.setTargetAtTime(v,this.ctx.currentTime,0.015);}
  stop(){if(!this.ctx)return;const t=this.ctx.currentTime,vg=this.vg;if(vg){vg.gain.cancelScheduledValues(t);vg.gain.setValueAtTime(vg.gain.value,t);vg.gain.linearRampToValueAtTime(0,t+0.03);}
    for(const s of this.srcs){s.onended=null;try{s.stop(t+0.04);}catch(e){}}this.srcs=[];this.playing=false;}
  pos(){if(!this.playing)return null;const e=this.ctx.currentTime-this.t0;if(e<0)return 0;return this.loop?e%this.dur:Math.min(e,this.dur);}
}

/* ---------- drawing ---------- */
function fitCanvas(cv){const r=window.devicePixelRatio||1,w=Math.round(cv.clientWidth*r),h=Math.round(cv.clientHeight*r);if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;}return [w,h,r];}
const cssVar=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function waveImage(cv,buf,markers,barSec){const [w,h,r]=fitCanvas(cv),o=document.createElement('canvas');o.width=w;o.height=h;const g=o.getContext('2d');
  g.fillStyle='#09090a';g.fillRect(0,0,w,h);const dur=buf.duration;
  if(barSec){g.strokeStyle='#1d1d21';g.lineWidth=1;for(let t=barSec;t<dur-1e-3;t+=barSec){const x=Math.round(t/dur*w)+0.5;g.beginPath();g.moveTo(x,0);g.lineTo(x,h);g.stroke();}}
  g.strokeStyle='#1a1a1e';g.beginPath();g.moveTo(0,h/2+0.5);g.lineTo(w,h/2+0.5);g.stroke();
  const L=buf.getChannelData(0),R=buf.getChannelData(1),spp=L.length/w,acc=cssVar('--accent');
  g.fillStyle=acc;g.globalAlpha=0.85;
  for(let x=0;x<w;x++){let mn=1,mx=-1;const a=Math.floor(x*spp),b=Math.min(L.length,Math.floor((x+1)*spp));for(let i=a;i<b;i+=Math.max(1,Math.floor((b-a)/64))){const v=(L[i]+R[i])*0.5;if(v<mn)mn=v;if(v>mx)mx=v;}
    const y1=h/2-mx*h*0.46,y2=h/2-mn*h*0.46;g.fillRect(x,y1,1,Math.max(1,y2-y1));}
  g.globalAlpha=1;(markers||[]).forEach(m=>{const x=Math.round(m.t/dur*w)+0.5;g.strokeStyle='#ece8e1';g.setLineDash([4*r,3*r]);g.beginPath();g.moveTo(x,0);g.lineTo(x,h);g.stroke();g.setLineDash([]);
    g.fillStyle='#ece8e1';g.font=`${10*r}px ${cssVar('--mono')}`;g.fillText(m.label,Math.min(x+5*r,w-90*r),13*r);});
  return o;}
function rollImage(cv,events,dur,key,barSec,colors){const [w,h,r]=fitCanvas(cv),o=document.createElement('canvas');o.width=w;o.height=h;const g=o.getContext('2d');
  g.fillStyle='#09090a';g.fillRect(0,0,w,h);if(!events.length)return o;
  let lo=Infinity,hi=-Infinity;events.forEach(e=>{lo=Math.min(lo,e.midi,e.midi2??e.midi);hi=Math.max(hi,e.midi,e.midi2??e.midi);});lo-=2;hi+=2;if(hi-lo<24){const c=(hi+lo)/2;lo=Math.floor(c-12);hi=Math.ceil(c+12);}
  const rows=hi-lo+1,rh=h/rows,y=m=>h-(m-lo+1)*rh;
  for(let m=lo;m<=hi;m++){const pc=((m-key.root)%12+12)%12;if(pc===0){g.fillStyle='rgba(255,255,255,.05)';g.fillRect(0,y(m),w,rh);}else if(inKey(key,m)){g.fillStyle='rgba(255,255,255,.018)';g.fillRect(0,y(m),w,rh);}}
  if(barSec){g.strokeStyle='#202025';for(let t=0;t<dur;t+=barSec){const x=Math.round(t/dur*w)+0.5;g.beginPath();g.moveTo(x,0);g.lineTo(x,h);g.stroke();}}
  events.forEach(e=>{const x=e.t/dur*w,ww=Math.max(2*r,e.dur/dur*w);g.fillStyle=colors[e.layer%colors.length];g.globalAlpha=e.layer===0?0.55:0.9;
    if(e.midi2!=null){g.strokeStyle=g.fillStyle;g.lineWidth=Math.max(1.5*r,rh*0.5);g.beginPath();g.moveTo(x,y(e.midi)+rh/2);g.lineTo(x+ww,y(e.midi2)+rh/2);g.stroke();}
    else g.fillRect(x,y(e.midi)+rh*0.12,Math.min(ww,w-x),Math.max(1.5*r,rh*0.76));});
  g.globalAlpha=1;g.fillStyle='#6d6a64';g.font=`${9*r}px ${cssVar('--mono')}`;for(let m=lo;m<=hi;m++)if(((m-key.root)%12+12)%12===0)g.fillText(midiName(m),4*r,y(m)+rh*0.8);
  return o;}
function drawWithHead(cv,img,p,dur){const g=cv.getContext('2d');if(!img)return;g.drawImage(img,0,0);if(p==null)return;const x=Math.round(p/dur*cv.width)+0.5;
  g.strokeStyle='#ece8e1';g.lineWidth=1.5*(window.devicePixelRatio||1);g.beginPath();g.moveTo(x,0);g.lineTo(x,cv.height);g.stroke();}
function drawScope(cv,an){const [w,h,r]=fitCanvas(cv),g=cv.getContext('2d');g.fillStyle='#09090a';g.fillRect(0,0,w,h);g.strokeStyle='#1a1a1e';g.beginPath();g.moveTo(0,h/2);g.lineTo(w,h/2);g.stroke();
  if(!an)return;const d=new Float32Array(an.fftSize);an.getFloatTimeDomainData(d);let s=0;for(let i=1;i<d.length/2;i++){if(d[i-1]<0&&d[i]>=0){s=i;break;}}
  g.strokeStyle=cssVar('--accent');g.lineWidth=1.5*r;g.beginPath();const n=1024;for(let i=0;i<n;i++){const x=i/n*w,yy=h/2-d[s+i]*h*0.45;i?g.lineTo(x,yy):g.moveTo(x,yy);}g.stroke();}

<script>
mountApp({
  n:9,id:'dialogue',short:'call',accent:'#f0a0b8',accentInk:'#2a0812',layers:[2],layerLabel:'09 · Top',
  titleHTML:'Call &amp; <em>Response</em>',
  tagline:'Two-voice dialogue phrases in key — a question contour answered by a complementary line. Built for explainer punctuation and beat-by-beat conversation.',
  legend:['Context bed','Call','Response'],rollColors:['#5e6b78','#f0a0b8','#7ec8d4'],
  controls:[
    {legend:'Tempo',items:[
      {id:'bpm',label:'BPM',type:'range',min:60,max:150,value:96},
      {id:'bars',label:'Bars',type:'select',options:[2,4,8],value:4},
      {id:'ending',label:'Ending',type:'seg',options:['Loop','Resolve'],value:'Resolve'},
    ]},
    {legend:'Voices',items:[
      {id:'callVoice',label:'Call',type:'seg',options:Object.keys(INSTRUMENTS),value:'Bell'},
      {id:'respVoice',label:'Response',type:'seg',options:Object.keys(INSTRUMENTS),value:'Glass'},
      {id:'contour',label:'Contour',type:'seg',options:['Ask / Answer','Rise / Fall','Near / Far'],value:'Ask / Answer'},
      {id:'gap',label:'Answer delay',type:'range',value:20,pct:true,fmt:v=>v<15?'tight':v<60?'a beat':'late'},
      {id:'density',label:'Density',type:'range',value:50,pct:true,unit:'%'},
      {id:'bed',label:'Bed',type:'toggle',value:true},
      {id:'reverb',label:'Space',type:'range',value:38,pct:true,unit:'%'},
    ]},
  ],
  async render(P,rng){
    const barSec=240/P.bpm,bars=+P.bars,L=barSec*bars,loop=P.ending==='Loop';let info;
    const r=await renderLoop({loopSec:L,tailSec:loop?4:6,fold:loop,build:(ctx,out)=>{info=genCallResp(ctx,out,P,rng,{barSec,bars,loopSec:L});return info.events;}});
    return single(r,{barSec,progLabel:info.label,readout:[['BPM',P.bpm],['Bars',bars],['Contour',P.contour]],stats:[['Exchanges',info.exchanges]]});
  },
  fileTag:P=>`call-${P.contour.toLowerCase().replace(/[^a-z]+/g,'-')}-${P.ending.toLowerCase()}_${P.bpm}bpm_${P.bars}bar`,
  noteTitle:'A conversation, not a monologue',
  noteHTML:`<p>Explainer cuts often need a <b>question then an answer</b> — two short phrases that talk to each other in the same key. The call rises or leans out; the response falls, inverts, or answers from further away. Both voices snap strong beats to chord tones, so the dialogue never leaves the key.</p>
  <p><i>Resolve</i> lands the last answer on the tonic, which is the right move for a title card or the end of a point. <i>Loop</i> leaves the last phrase open so you can repeat the exchange under a sequence. Turn the bed off to export the two voices alone.</p>`,
});
function genCallResp(ctx,out,P,rng,T){
  const k=P.key,bar=T.barSec,s16=bar/16,bars=T.bars,ev=[],prog=rng.pick(PROGS[k.mode]);
  const bus=fxBus(ctx,out,{reverb:P.reverb??0.38,size:3.4,bright:0.62,delay:0.18,delayTime:bar*3/16,feedback:0.28});
  const callI=INSTRUMENTS[P.callVoice]||INSTRUMENTS.Bell,respI=INSTRUMENTS[P.respVoice]||INSTRUMENTS.Glass;
  const callOct=INST_OCT[P.callVoice]||5,respOct=INST_OCT[P.respVoice]||5;
  const nNotes=3+Math.round((P.density??0.5)*4);
  const delaySteps=Math.round((P.gap??0.2)*6);
  const motif=()=>{let d=rng.pick([0,2,4]);const o=[{s:0,deg:d,len:2}];let pos=2;
    for(let i=1;i<nNotes;i++){const rest=rng.chance(0.15)?1:0;pos+=rest;d=clamp(d+rng.pick([-2,-1,1,2,3]),-2,9);const len=rng.pick([1,2,2,3]);o.push({s:pos,deg:d,len});pos+=len;if(pos>=14)break;}
    return o;};
  const callM=motif();
  const answer=callM.map(n=>{let deg=n.deg;
    if(P.contour==='Ask / Answer')deg=callM[0].deg-(n.deg-callM[0].deg);
    else if(P.contour==='Rise / Fall')deg=n.deg-3;
    else deg=n.deg+rng.pick([3,4,5]);
    return {...n,deg,s:n.s+delaySteps};});
  let exchanges=0;
  for(let pair=0;pair<Math.floor(bars/2);pair++){
    const bCall=pair*2,bResp=bCall+1;exchanges++;
    const snap=(deg,b)=>{const cd=prog[b%prog.length],tones=[cd,cd+2,cd+4].map(x=>x%7);let best=deg,bd=9;
      for(let o=-3;o<=3;o++){const x=deg+o;if(tones.includes(((x%7)+7)%7)&&Math.abs(o)<bd){bd=Math.abs(o);best=x;}}return best;};
    callM.forEach(n=>{const t=bCall*bar+n.s*s16,dg=n.s%4===0?snap(n.deg,bCall):n.deg,m=degMidi(k,dg,callOct);
      callI(ctx,bus,t,n.len*s16,m,n.s===0?1:0.78);ev.push({t,dur:n.len*s16,midi:m,layer:1});});
    let phrase=answer;
    if(P.ending==='Resolve'&&bResp===bars-1){phrase=answer.map(n=>({...n}));const last=phrase[phrase.length-1];last.deg=0;last.len=Math.max(last.len,16-last.s);}
    phrase.forEach(n=>{if(n.s>=16)return;const t=bResp*bar+n.s*s16,dg=n.s%4===0?snap(n.deg,bResp):n.deg,m=degMidi(k,dg,respOct);
      respI(ctx,bus,t,n.len*s16,m,0.82);ev.push({t,dur:n.len*s16,midi:m,layer:2});});
  }
  if(P.bed){const bed=ctx.createGain();bed.gain.value=0.55;bed.connect(bus);
    for(let b=0;b<bars;b++){const t0=b*bar,cd=prog[b%prog.length];
      fold(chordMidis(k,cd,3,3),48,67).forEach(m=>{const g=ctx.createGain();const e=adsr(g.gain,t0,{a:0.3,d:0.3,s:0.75,r:0.5,peak:0.045,hold:t0+bar-0.25});
        osc(ctx,'triangle',mtof(m),t0,e).connect(g);g.connect(bed);ev.push({t:t0,dur:bar,midi:m,layer:0});});}}
  const calls=ev.filter(e=>e.layer===1).slice(0,6).map(e=>midiName(e.midi)).join(' ');
  return {events:ev,exchanges,label:calls+'  ↔  answer'};
}

</script>
</body></html>
